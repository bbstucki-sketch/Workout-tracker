<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workout Tracker</title>
    <style>
        :root {
            --bg: #121212;
            --card: #1e1e1e;
            --accent: #bb86fc;
            --text: #e0e0e0;
            --subtext: #a0a0a0;
            --input-bg: #2d2d2d;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        h1, h2 { text-align: center; color: var(--accent); }

        .card {
            background-color: var(--card);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        label {
            display: block;
            margin-top: 8px;
            font-size: 0.9em;
            color: var(--subtext);
        }

        input, select, button {
            width: 100%;
            padding: 10px;
            margin-top: 4px;
            border-radius: 4px;
            border: 1px solid #333;
            background-color: var(--input-bg);
            color: var(--text);
            box-sizing: border-box;
        }

        button {
            background-color: var(--accent);
            color: #000;
            font-weight: bold;
            border: none;
            margin-top: 16px;
            cursor: pointer;
        }

        button:hover { opacity: 0.9; }

        .previous-info {
            background-color: #252525;
            border-left: 3px solid var(--accent);
            padding: 8px 12px;
            margin: 12px 0;
            font-size: 0.9em;
            color: var(--subtext);
        }

        .row {
            display: flex;
            gap: 8px;
        }

        .row > div { flex: 1; }

        .history-item {
            border-bottom: 1px solid #333;
            padding: 8px 0;
            font-size: 0.9em;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Workout Tracker</h1>

    <div class="card">
        <h2>Add Custom Exercise</h2>
        <input type="text" id="newExerciseName" placeholder="e.g., Bench Press, Planks">
        <label>Tracking Type</label>
        <select id="newExerciseType">
            <option value="reps">Weight & Reps</option>
            <option value="duration">Duration (Seconds)</option>
        </select>
        <button onclick="addExercise()">Save Exercise</button>
    </div>

    <div class="card">
        <h2>Log Workout</h2>
        <label>Select Exercise</label>
        <select id="exerciseSelect" onchange="loadPreviousData()"></select>

        <div id="previousDisplay" class="previous-info">
            Select an exercise to see last performance.
        </div>

        <div id="repsInputs">
            <div class="row">
                <div>
                    <label>Weight (lbs/kg)</label>
                    <input type="number" id="inputWeight" placeholder="0">
                </div>
                <div>
                    <label>Reps</label>
                    <input type="number" id="inputReps" placeholder="0">
                </div>
                <div>
                    <label>Sets</label>
                    <input type="number" id="inputSets" placeholder="1" value="1">
                </div>
            </div>
        </div>

        <div id="durationInputs" style="display: none;">
            <label>Duration (seconds)</label>
            <input type="number" id="inputDuration" placeholder="e.g. 60">
        </div>

        <button onclick="logWorkout()">Log Entry</button>
    </div>

    <div class="card">
        <h2>History</h2>
        <div id="historyList">No logged workouts yet.</div>
    </div>
</div>

<script>
    let exercises = JSON.parse(localStorage.getItem('exercises')) || [
        { name: "Bench Press", type: "reps" },
        { name: "Plank", type: "duration" }
    ];
    let logs = JSON.parse(localStorage.getItem('logs')) || [];

    function saveState() {
        localStorage.setItem('exercises', JSON.stringify(exercises));
        localStorage.setItem('logs', JSON.stringify(logs));
    }

    function initUI() {
        const select = document.getElementById('exerciseSelect');
        select.innerHTML = '';
        exercises.forEach((ex, idx) => {
            const opt = document.createElement('option');
            opt.value = idx;
            opt.textContent = ex.name;
            select.appendChild(opt);
        });
        loadPreviousData();
        renderHistory();
    }

    function addExercise() {
        const nameInput = document.getElementById('newExerciseName');
        const typeInput = document.getElementById('newExerciseType');
        if (!nameInput.value.trim()) return alert("Enter exercise name");

        exercises.push({ name: nameInput.value.trim(), type: typeInput.value });
        saveState();
        nameInput.value = '';
        initUI();
        document.getElementById('exerciseSelect').value = exercises.length - 1;
        loadPreviousData();
    }

    function loadPreviousData() {
        const select = document.getElementById('exerciseSelect');
        if (exercises.length === 0) return;
        
        const selectedEx = exercises[select.value];
        const prevDisplay = document.getElementById('previousDisplay');
        const repsInputs = document.getElementById('repsInputs');
        const durationInputs = document.getElementById('durationInputs');

        // Toggle UI field visibility
        if (selectedEx.type === 'reps') {
            repsInputs.style.display = 'block';
            durationInputs.style.display = 'none';
        } else {
            repsInputs.style.display = 'none';
            durationInputs.style.display = 'block';
        }

        // Find last log entry for this exercise
        const lastLog = logs.slice().reverse().find(l => l.name === selectedEx.name);

        if (lastLog) {
            if (selectedEx.type === 'reps') {
                prevDisplay.innerHTML = `<strong>Last Session:</strong> ${lastLog.weight} lbs/kg × ${lastLog.reps} reps (${lastLog.sets || 1} sets)`;
                document.getElementById('inputWeight').value = lastLog.weight;
                document.getElementById('inputReps').value = lastLog.reps;
                document.getElementById('inputSets').value = lastLog.sets || 1;
            } else {
                prevDisplay.innerHTML = `<strong>Last Session:</strong> ${lastLog.duration} seconds`;
                document.getElementById('inputDuration').value = lastLog.duration;
            }
        } else {
            prevDisplay.innerHTML = "No previous logs for this exercise.";
            document.getElementById('inputWeight').value = '';
            document.getElementById('inputReps').value = '';
            document.getElementById('inputSets').value = 1;
            document.getElementById('inputDuration').value = '';
        }
    }

    function logWorkout() {
        const select = document.getElementById('exerciseSelect');
        if (exercises.length === 0) return;

        const selectedEx = exercises[select.value];
        const date = new Date().toLocaleDateString();

        let logEntry = { name: selectedEx.name, type: selectedEx.type, date: date };

        if (selectedEx.type === 'reps') {
            const weight = document.getElementById('inputWeight').value;
            const reps = document.getElementById('inputReps').value;
            const sets = document.getElementById('inputSets').value;
            if (!weight || !reps) return alert("Please fill in weight and reps.");
            logEntry.weight = weight;
            logEntry.reps = reps;
            logEntry.sets = sets;
        } else {
            const duration = document.getElementById('inputDuration').value;
            if (!duration) return alert("Please fill in duration.");
            logEntry.duration = duration;
        }

        logs.push(logEntry);
        saveState();
        loadPreviousData();
        renderHistory();
    }

    function renderHistory() {
        const historyList = document.getElementById('historyList');
        if (logs.length === 0) {
            historyList.innerHTML = "No logged workouts yet.";
            return;
        }

        historyList.innerHTML = logs.slice().reverse().map(l => {
            const detail = l.type === 'reps' 
                ? `${l.weight} lbs/kg × ${l.reps} reps (${l.sets} sets)`
                : `${l.duration} secs`;
            return `<div class="history-item"><strong>${l.date} - ${l.name}:</strong> ${detail}</div>`;
        }).join('');
    }

    // Initialize App
    initUI();
</script>
</body>
</html>
